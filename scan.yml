name: Run CFL playoff scan

on:
  schedule:
    # Runs at 6am, 12pm, and 10pm UTC every day. GitHub's schedule
    # triggers are "best-effort" and can occasionally run a bit late,
    # especially at busy times (e.g. the top of the hour) -- fine for
    # this use case, since nobody is waiting live on any single run.
    # Adjust the times below (in UTC) to whatever cadence makes sense --
    # e.g. more often on game days. Use https://crontab.guru to check
    # any cron expression you write.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  # Lets you trigger a run manually from the Actions tab on GitHub,
  # without waiting for the next scheduled time -- useful for testing,
  # or for checking scenarios right after a game you know just ended.
  workflow_dispatch:

# Lets this workflow commit the updated results.json back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scan
        run: python run_and_save.py

      - name: Commit and push the updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json scan_error.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update playoff scenario results"
          git push
